name: CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/RayBork/RayBork.slnx

      - name: Build Debug
        run: dotnet build src/RayBork/RayBork.slnx -c Debug --no-restore

      - name: Build Release
        run: dotnet build src/RayBork/RayBork.slnx -c Release --no-restore

      - name: Test
        run: dotnet test src/RayBork/RayBork.slnx -c Debug --no-build --no-restore

      - name: Format
        run: dotnet format src/RayBork/RayBork.slnx --verify-no-changes --no-restore

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Markdown links and fences
        shell: pwsh
        run: ./scripts/check-docs.ps1

  gpu:
    name: gpu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Vulkan and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers xvfb

      - name: Resolve the lavapipe ICD
        run: |
          shopt -s nullglob
          icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          if [ ${#icds[@]} -eq 0 ]; then
            echo "No lavapipe ICD found under /usr/share/vulkan/icd.d." >&2
            exit 1
          fi
          echo "VK_ICD_FILENAMES=${icds[0]}" >> "$GITHUB_ENV"
          echo "Using lavapipe ICD: ${icds[0]}"

      - name: Restore
        run: dotnet restore src/RayBork/RayBork.slnx

      - name: Build Debug
        run: dotnet build src/RayBork/RayBork.slnx -c Debug --no-restore

      - name: GPU tests
        run: xvfb-run --auto-servernum dotnet test src/RayBork/RayBork.slnx -c Debug --no-build --no-restore --filter "Category=Gpu"
